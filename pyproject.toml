[project]
name = "bank-fraud-cheque-recovery"
version = "1.0.0"
description = "Explainable bank transaction risk and cheque recovery analytics starter"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.36",
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
